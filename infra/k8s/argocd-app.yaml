apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opsforge-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MouadModnibi/OpsForge.git
    targetRevision: main
    path: infra/k8s/helm-chart
    helm:
      releaseName: opsforge-api
      values: |
        api:
          replicas: 3
        postgres:
          replicas: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
