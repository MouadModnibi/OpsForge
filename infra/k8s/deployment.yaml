apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsforge-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: opsforge-api
  template:
    metadata:
      labels:
        app: opsforge-api
    spec:
      containers:
        - name: api
          image: mouadmodnibi/opsforge-api:a353713bb136630dda64febde54055984f520a57
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: DATABASE_URL